<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoTrade Verification</title>
</head>

<body
  style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8fafc; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table border="0" cellpadding="0" cellspacing="0" width="100%"
          style="max-width: 600px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);">
          <tr>
            <td height="6" style="background: linear-gradient(90deg, #FF7A00 0%, #FFB800 100%);"></td>
          </tr>
          <tr>
            <td align="center" style="padding: 32px 40px 24px 40px; border-bottom: 1px solid #f1f5f9;">
              <h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: #FF7A00;">
                AutoTrade</h1>
              <p
                style="margin: 4px 0 0 0; font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 1px; text-transform: uppercase;">
                Genuine Parts & Premium Care</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 40px; color: #334155; font-size: 16px; line-height: 26px;">
              <h2 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 700; color: #0f172a;">Verify your account
              </h2>
              <p style="margin: 0 0 20px 0;">Hello {{name}},</p>
              <p style="margin: 0 0 24px 0;">Use the following security verification code to complete your registration
                request. This code is valid for <strong>{{expiry}}</strong> minutes.</p>
              <div
                style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 36px; font-weight: 800; letter-spacing: 8px; text-align: center; padding: 20px; margin: 24px 0; color: #0f172a; font-family: monospace;">
                {{otp}}
              </div>
              <p style="margin: 0; font-size: 14px; color: #64748b;">If you did not initiate this request, you can
                safely ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
